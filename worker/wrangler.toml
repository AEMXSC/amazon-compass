name = "amazon-compass-worker"
main = "ims-token-proxy.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering — pixel-perfect JCR author preview
[browser]
binding = "BROWSER"

# R2 — stores Firefly-generated images (public via /img/:key)
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "amazon-compass-images"

# Deploy:  npx wrangler deploy
#
# Adobe IMS Secrets (shared by MCP tools + Firefly image generation):
#   npx wrangler secret put IMS_CLIENT_ID
#   npx wrangler secret put IMS_CLIENT_SECRET
#   npx wrangler secret put COMPASS_OAUTH_SECRET
#
# GitHub OAuth:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#
# Workfront:
#   npx wrangler secret put WORKFRONT_API_KEY
#
# AWS Bedrock + Kendra (SigV4 signing — replaces Gemini API key):
#   npx wrangler secret put AWS_ACCESS_KEY_ID
#   npx wrangler secret put AWS_SECRET_ACCESS_KEY
#   npx wrangler secret put AWS_REGION              (e.g. us-east-1)
#   npx wrangler secret put KENDRA_INDEX_ID         (Amazon Kendra Index ID from AWS Console)
#
# Note: Firefly uses IMS_CLIENT_ID + IMS_CLIENT_SECRET (no separate Firefly secrets needed)
#
# Callback URLs (register in developer consoles):
#   GitHub: https://amazon-compass-worker.<account>.workers.dev/github/callback
#   Adobe:  https://amazon-compass-worker.<account>.workers.dev/ims/callback
